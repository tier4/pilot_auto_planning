name: backport
on:
  pull_request_target:
    types:
      - closed
      - labeled

permissions: {}

jobs:
  backport:
    runs-on: ubuntu-24.04
    # The runner only reads: it cherry-picks to detect conflicts and comments on the
    # original pull request. It creates no branch and pushes nothing, so `contents`
    # stays at read.
    permissions:
      contents: read
      pull-requests: write
    # Only react to merged PRs for security reasons.
    # See https://docs.github.com/en/actions/using-workflows/events-that-trigger-workflows#pull_request_target.
    if: >
      github.event.pull_request.merged
      && (
        github.event.action == 'closed'
        || (
          github.event.action == 'labeled'
          && contains(github.event.label.name, 'backport')
        )
      )
    steps:
      - name: Resolve backport target branches
        id: targets
        env:
          ACTION: ${{ github.event.action }}
          LABEL: ${{ github.event.label.name }}
        run: |
          if [ "${ACTION}" = "labeled" ]; then
            printf '%s\n' "${LABEL}"
          else
            jq -r '.pull_request.labels[].name' "${GITHUB_EVENT_PATH}"
          fi | sed -n 's/^backport \([^ ]\+\)$/\1/p' | sort -u > "${RUNNER_TEMP}/bases.txt"
          echo "count=$(wc -l < "${RUNNER_TEMP}/bases.txt")" >> "${GITHUB_OUTPUT}"
          cat "${RUNNER_TEMP}/bases.txt"

      - name: Checkout
        if: steps.targets.outputs.count != '0'
        uses: actions/checkout@v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      # The runner cherry-picks only to detect conflicts. It does not create or push
      # the backport branch: GITHUB_TOKEN is refused when creating that remote ref.
      # A clean cherry-pick is reported as Ubuntu commands on the original pull
      # request. Conflicts are written to the comment file below.
      - name: Backport
        if: steps.targets.outputs.count != '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          failed=0
          while read -r base; do
            [ -n "${base}" ] || continue
            head="backport-${PR_NUMBER}-to-${base}"
            echo "::group::Backporting ${MERGE_SHA} from #${PR_NUMBER} to ${base} on ${head}"
            if ! ./.github/workflows/scripts/backport_one.py "${base}" "${head}" < /dev/null; then
              failed=1
              gh pr comment "${PR_NUMBER}" --repo "${REPO}" \
                --body-file "${RUNNER_TEMP}/comment.md" < /dev/null || true
            fi
            echo "::endgroup::"
          done < "${RUNNER_TEMP}/bases.txt"
          exit "${failed}"
