name: build-and-test-differential

on:
  workflow_call:
    inputs:
      container:
        required: true
        type: string
      # Why is it a JSON string?
      # https://github.com/orgs/community/discussions/11692#discussioncomment-3541856
      runner:
        default: ubuntu-24.04
        required: false
        type: string
      rosdistro:
        default: jazzy
        required: false
        type: string
      run-condition:
        default: true
        required: false
        type: boolean
      container-suffix:
        required: false
        default: ""
        type: string
      build-pre-command:
        required: false
        default: ""
        type: string
      enable-agnocast:
        required: false
        default: false
        type: boolean

env:
  CC: /usr/lib/ccache/gcc
  CXX: /usr/lib/ccache/g++
  CCACHE_DIR: /root/.ccache
  ENABLE_AGNOCAST: ${{ inputs.enable-agnocast && '1' || '0' }}

jobs:
  build-and-test-differential:
    if: ${{ inputs.run-condition }}
    runs-on: ${{ inputs.runner }}
    container:
      image: ${{ inputs.container }}${{ inputs.container-suffix }}
      options: --cap-add=NET_ADMIN
    steps:
      - name: Set PR fetch depth
        run: echo "PR_FETCH_DEPTH=$(( ${{ github.event.pull_request.commits }} + 1 ))" >> "${GITHUB_ENV}"
        shell: bash

      - name: Checkout PR branch and all PR commits
        uses: actions/checkout@v4.4.0
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: ${{ env.PR_FETCH_DEPTH }}

      - name: Enable multicast on loopback
        run: |
          if ip link set lo multicast on; then
            echo "multicast enabled on lo"
          else
            echo "::warning title=DDS tuning::could not enable multicast on lo (NET_ADMIN missing?)"
          fi
        shell: bash

      - name: Relax CycloneDDS receive buffer requirement
        run: |
          if [ -f /home/aw/cyclonedds.xml ]; then
            sed -i 's|min="10MB"|min="default"|' /home/aw/cyclonedds.xml
            echo "patched: SocketReceiveBufferSize min=\"default\""
          else
            echo "::notice title=DDS tuning::/home/aw/cyclonedds.xml not present, skipping patch"
          fi
        shell: bash

      - name: Show disk space before the tasks
        run: df -h
        shell: bash

      - name: Show machine specs
        run: lscpu && free -h
        shell: bash

      - name: Ignore packages that require CUDA
        run: |
          touch universe/autoware_diffusion_planner/COLCON_IGNORE
          touch universe/autoware_ml_planner/COLCON_IGNORE
          touch universe/autoware_mppi_optimizer/COLCON_IGNORE
          sed -i '/<depend>autoware_mppi_optimizer<\/depend>/d' universe/autoware_safety_planner/package.xml
        shell: bash

      - name: Remove exec_depend
        uses: autowarefoundation/autoware-github-actions/remove-exec-depend@v1.69.2

      - name: Get modified packages
        id: get-modified-packages
        uses: autowarefoundation/autoware-github-actions/get-modified-packages@v1.69.2

      - name: Create ccache directory
        run: |
          mkdir -p ${CCACHE_DIR}
          du -sh ${CCACHE_DIR} && ccache -s
        shell: bash

      - name: Attempt to restore ccache
        uses: actions/cache/restore@v4.3.0
        with:
          path: |
            /root/.ccache
          key: ccache-main-${{ runner.arch }}-${{ inputs.rosdistro }}-${{ github.event.pull_request.base.sha }}
          restore-keys: |
            ccache-main-${{ runner.arch }}-${{ inputs.rosdistro }}-

      - name: Show ccache stats before build and reset stats
        run: |
          du -sh ${CCACHE_DIR} && ccache -s
          ccache --zero-stats
        shell: bash

      - name: Export CUDA state as a variable for adding to cache key
        run: |
          build_type_cuda_state=nocuda
          if [[ "${{ inputs.container-suffix }}" == "-cuda" ]]; then
            build_type_cuda_state=cuda
          fi
          echo "BUILD_TYPE_CUDA_STATE=$build_type_cuda_state" >> "${GITHUB_ENV}"
          echo "::notice::BUILD_TYPE_CUDA_STATE=$build_type_cuda_state"
        shell: bash

      - name: Clone dependency packages
        run: |
          mkdir -p dependency_ws
          vcs import --recursive dependency_ws < build_depends_jazzy.repos
        shell: bash

      - name: Build
        if: ${{ steps.get-modified-packages.outputs.modified-packages != '' }}
        uses: autowarefoundation/autoware-github-actions/colcon-build@v1.69.2
        with:
          rosdistro: ${{ inputs.rosdistro }}
          target-packages: ${{ steps.get-modified-packages.outputs.modified-packages }}
          cache-key-element: ${{ env.BUILD_TYPE_CUDA_STATE }}${{ inputs.enable-agnocast && '-agnocast' || '' }}
          build-pre-command: ${{ inputs.build-pre-command }}
      - name: Show ccache stats after build
        run: du -sh ${CCACHE_DIR} && ccache -s
        shell: bash

      - name: Add workspace libraries to the library path for tests
        if: ${{ inputs.enable-agnocast }}
        run: echo "LD_LIBRARY_PATH=$(ls -d "${PWD}"/install/*/lib | paste -sd:)${LD_LIBRARY_PATH:+:${LD_LIBRARY_PATH}}" >> "${GITHUB_ENV}"
        shell: bash

      - name: Test
        id: test
        env:
          ENABLE_AGNOCAST: "0"
        if: ${{ steps.get-modified-packages.outputs.modified-packages != '' }}
        uses: autowarefoundation/autoware-github-actions/colcon-test@v1.69.2
        with:
          rosdistro: ${{ inputs.rosdistro }}
          target-packages: ${{ steps.get-modified-packages.outputs.modified-packages }}

      - name: Show disk space after the tasks
        run: df -h
        shell: bash
