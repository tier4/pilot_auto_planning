name: build-test-tidy-pr

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  build-and-test-differential:
    uses: ./.github/workflows/build-and-test-differential.yaml
    with:
      container: ghcr.io/autowarefoundation/autoware:universe-devel-jazzy

  build-and-test-differential-agnocast:
    uses: ./.github/workflows/build-and-test-differential.yaml
    with:
      container: ghcr.io/autowarefoundation/autoware:universe-devel-jazzy
      enable-agnocast: true

  check-if-cuda-packages-changed:
    runs-on: ubuntu-24.04
    outputs:
      cuda: ${{ steps.paths_filter.outputs.cuda }}
    steps:
      - uses: dorny/paths-filter@v3.0.4
        id: paths_filter
        with:
          filters: |
            cuda:
              - 'universe/autoware_diffusion_planner/**'
              - 'universe/autoware_ml_planner/**'
              - 'universe/autoware_mppi_optimizer/**'

  # Runs only when a CUDA package changes: the CUDA image is large, and the other packages are built above.
  build-and-test-differential-cuda:
    needs: check-if-cuda-packages-changed
    uses: ./.github/workflows/build-and-test-differential.yaml
    with:
      container: ghcr.io/autowarefoundation/autoware:universe-devel-cuda-jazzy
      run-condition: ${{ needs.check-if-cuda-packages-changed.outputs.cuda == 'true' }}
